<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 280px;
      background: #0a0a0a;
      color: #f2f2f2;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      line-height: 1.5;
    }

    #app { padding: 16px; }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #1f1f1f;
    }

    .logo {
      font-size: 15px;
      font-weight: 700;
      color: #f2f2f2;
      letter-spacing: -0.3px;
    }

    .badge {
      font-size: 10px;
      font-weight: 600;
      color: #9ca3af;
      background: #1f1f1f;
      border-radius: 4px;
      padding: 2px 6px;
    }

    .section-label {
      font-size: 11px;
      font-weight: 600;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .field-label {
      font-size: 12px;
      color: #9ca3af;
      margin-bottom: 4px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      background: #111;
      border: 1px solid #1f1f1f;
      border-radius: 8px;
      padding: 8px 10px;
      color: #f2f2f2;
      font-size: 13px;
      font-family: inherit;
      outline: none;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: #333;
    }

    .btn {
      width: 100%;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      border: none;
      transition: opacity 0.15s;
    }

    .btn:disabled { opacity: 0.5; cursor: default; }

    .btn-primary {
      background: #f2f2f2;
      color: #0a0a0a;
    }

    .btn-secondary {
      background: #1f1f1f;
      color: #f2f2f2;
    }

    .btn-danger {
      background: transparent;
      color: #ef4444;
      border: 1px solid #7f1d1d;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 12px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot-green { background: #22c55e; }
    .dot-amber { background: #f59e0b; }
    .dot-red { background: #ef4444; }

    .status-text {
      font-size: 12px;
      color: #9ca3af;
    }

    .url-row {
      background: #111;
      border: 1px solid #1f1f1f;
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 12px;
      overflow: hidden;
    }

    .url-label {
      font-size: 10px;
      color: #9ca3af;
      margin-bottom: 2px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      font-weight: 600;
    }

    .url-value {
      font-size: 11px;
      color: #f2f2f2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .result-box {
      background: #111;
      border: 1px solid #1f1f1f;
      border-radius: 8px;
      padding: 10px 12px;
      margin-top: 10px;
      font-size: 12px;
    }

    .result-success { border-color: rgba(34,197,94,0.3); color: #22c55e; }
    .result-error { border-color: rgba(239,68,68,0.3); color: #ef4444; }
    .result-info { color: #9ca3af; }

    .token-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 12px;
    }

    .token-display {
      flex: 1;
      font-family: monospace;
      font-size: 11px;
      color: #9ca3af;
      background: #111;
      border: 1px solid #1f1f1f;
      border-radius: 8px;
      padding: 7px 10px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .icon-btn {
      padding: 6px 8px;
      background: #1f1f1f;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      color: #9ca3af;
      font-size: 12px;
      flex-shrink: 0;
    }

    .icon-btn:hover { color: #f2f2f2; }

    .divider {
      border: none;
      border-top: 1px solid #1f1f1f;
      margin: 14px 0;
    }

    .hint {
      font-size: 11px;
      color: #9ca3af;
      line-height: 1.5;
    }

    .hint a {
      color: #f2f2f2;
      text-decoration: underline;
    }

    .mt-8 { margin-top: 8px; }
    .mt-12 { margin-top: 12px; }
    .gap-8 { display: flex; flex-direction: column; gap: 8px; }
  </style>
</head>
<body>
  <div id="app">
    <div style="padding: 24px 16px; text-align: center; color: #9ca3af; font-size: 12px;">
      Loading...
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
