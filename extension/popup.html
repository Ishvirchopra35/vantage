<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap"
    rel="stylesheet"
  />
  <style>
    /* Vantage dark-glass design system (matches app/globals.css dark theme).
       Cards are borderless glass: top-left sheen, inset top glint, hairline
       edge, soft drop. Primary action is dark-filled white text. Gold is
       reserved for the status badge only. */
    :root {
      --bg: #0a0a0a;
      --card: #111111;
      --card-raised: #161616;
      --card-sunken: #0d0d0d;
      --text: #f2f2f2;
      --muted: #9ca3af;
      --border: #1f1f1f;
      --border-subtle: #171717;
      --gold: #c9a227;
      --gold-dim: rgba(201, 162, 39, 0.12);
      --glass-hover: rgba(255, 255, 255, 0.06);
      --focus-ring: rgba(255, 255, 255, 0.08);
      --btn-primary-bg: #1e1e1e;
      --btn-primary-bg-hover: #262626;
      --radius: 12px;
      --radius-sm: 8px;
      --score-red: #ef4444;
      --score-amber: #f59e0b;
      --score-green: #22c55e;
      --font-display: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-body: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --scrollbar-thumb: #2e2e2e;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    * { scrollbar-width: thin; scrollbar-color: var(--scrollbar-thumb) transparent; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: var(--scrollbar-thumb);
      border-radius: 20px;
      border: 2px solid transparent;
      background-clip: padding-box;
    }

    body {
      width: 300px;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 13px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    #app { padding: 18px; }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .logo {
      font-family: var(--font-display);
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.02em;
    }

    /* Compact pill badge - the one gold accent in the popup. */
    .badge {
      font-family: var(--font-display);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--gold);
      background: var(--gold-dim);
      border: none;
      border-radius: 20px;
      padding: 2px 7px;
    }

    .section-label {
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }

    .field-label {
      font-family: var(--font-body);
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      background: var(--card-raised);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
      padding: 9px 12px;
      color: var(--text);
      font-size: 13px;
      font-family: var(--font-body);
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: var(--border);
      box-shadow: 0 0 0 3px var(--focus-ring);
    }

    input::placeholder { color: var(--muted); }

    .btn {
      width: 100%;
      padding: 10px 14px;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 600;
      font-family: var(--font-display);
      cursor: pointer;
      border: none;
      transition: box-shadow 0.2s ease, opacity 0.15s ease, background 0.15s ease;
    }

    .btn:disabled { opacity: 0.5; cursor: default; }

    /* Primary action: dark filled, white text, machined glint (.ds-btn-primary). */
    .btn-primary {
      background: var(--btn-primary-bg);
      color: #ffffff;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.1),
        inset 0 -1px 0 rgba(0, 0, 0, 0.3);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--btn-primary-bg-hover);
    }

    /* Secondary: dark glass (.ds-btn). */
    .btn-secondary {
      background: var(--card-raised);
      color: var(--text);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }

    .btn-secondary:hover:not(:disabled) {
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        inset 0 0 0 1px rgba(255, 255, 255, 0.08);
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.1);
      color: var(--score-red);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }

    .btn-danger:hover:not(:disabled) {
      background: rgba(239, 68, 68, 0.16);
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 14px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot-green { background: var(--score-green); box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.15); }
    .dot-amber { background: var(--score-amber); box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.15); }
    .dot-red { background: var(--score-red); box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15); }

    .status-text {
      font-family: var(--font-body);
      font-size: 12px;
      color: var(--muted);
    }

    /* Borderless glass cards: sheen + glint + hairline + soft drop. */
    .url-row {
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.04) 0%, rgba(255, 255, 255, 0) 60%),
        var(--card);
      border: none;
      border-radius: var(--radius);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.07),
        inset 0 0 0 1px rgba(255, 255, 255, 0.02),
        0 8px 22px -10px rgba(0, 0, 0, 0.5);
      padding: 10px 12px;
      margin-bottom: 14px;
      overflow: hidden;
    }

    .url-label {
      font-family: var(--font-display);
      font-size: 10px;
      color: var(--muted);
      margin-bottom: 3px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 600;
    }

    .url-value {
      font-family: var(--font-body);
      font-size: 11px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .result-box {
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.04) 0%, rgba(255, 255, 255, 0) 60%),
        var(--card);
      border: none;
      border-radius: var(--radius);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.07),
        inset 0 0 0 1px rgba(255, 255, 255, 0.02),
        0 8px 22px -10px rgba(0, 0, 0, 0.5);
      padding: 10px 12px;
      margin-top: 10px;
      font-size: 12px;
      font-family: var(--font-body);
      line-height: 1.5;
    }

    .result-success {
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.07),
        inset 0 0 0 1px rgba(34, 197, 94, 0.25),
        0 8px 22px -10px rgba(0, 0, 0, 0.5);
      color: var(--score-green);
    }

    .result-error {
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.07),
        inset 0 0 0 1px rgba(239, 68, 68, 0.25),
        0 8px 22px -10px rgba(0, 0, 0, 0.5);
      color: var(--score-red);
    }

    .result-info { color: var(--muted); }

    .token-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 12px;
    }

    .token-display {
      flex: 1;
      font-family: monospace;
      font-size: 11px;
      color: var(--muted);
      background: var(--card-sunken);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 8px 10px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .icon-btn {
      padding: 7px 10px;
      background: var(--card-raised);
      border: none;
      border-radius: var(--radius-sm);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
      cursor: pointer;
      color: var(--muted);
      font-family: var(--font-display);
      font-size: 12px;
      font-weight: 600;
      flex-shrink: 0;
      transition: color 0.15s ease, box-shadow 0.15s ease;
    }

    .icon-btn:hover {
      color: var(--text);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        inset 0 0 0 1px rgba(255, 255, 255, 0.08);
    }

    .divider {
      border: none;
      border-top: 1px solid var(--border-subtle);
      margin: 16px 0;
    }

    .hint {
      font-family: var(--font-body);
      font-size: 11px;
      color: var(--muted);
      line-height: 1.6;
    }

    .hint a {
      color: var(--text);
      text-decoration: underline;
      text-underline-offset: 2px;
      font-weight: 600;
    }

    .hint a:hover { color: #ffffff; }

    .mt-8 { margin-top: 8px; }
    .mt-12 { margin-top: 12px; }
    .gap-8 { display: flex; flex-direction: column; gap: 8px; }
  </style>
</head>
<body>
  <div id="app">
    <div style="padding: 24px 16px; text-align: center; color: #9ca3af; font-size: 12px;">
      Loading...
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
