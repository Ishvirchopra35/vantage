<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap"
    rel="stylesheet"
  />
  <style>
    /* Vantage design system tokens (matches app/globals.css dark theme) */
    :root {
      --bg: #0a0a0a;
      --card: #111111;
      --card-raised: #161616;
      --card-sunken: #0d0d0d;
      --text: #f2f2f2;
      --muted: #9ca3af;
      --border: #1f1f1f;
      --border-subtle: #171717;
      --gold: #d4a847;
      --gold-dim: rgba(212, 168, 71, 0.12);
      --gold-border: rgba(212, 168, 71, 0.4);
      --radius: 12px;
      --radius-sm: 8px;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.4), 0 1px 2px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.5), 0 2px 4px rgba(0, 0, 0, 0.3);
      --score-red: #ef4444;
      --score-amber: #f59e0b;
      --score-green: #22c55e;
      --font-display: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-body: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 300px;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 13px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    #app { padding: 18px; }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-family: var(--font-display);
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.02em;
    }

    /* Gold accent pill (design-system badge treatment) */
    .badge {
      font-family: var(--font-display);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--gold);
      background: var(--gold-dim);
      border: 1px solid var(--gold-border);
      border-radius: var(--radius-sm);
      padding: 3px 8px;
    }

    .section-label {
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }

    .field-label {
      font-family: var(--font-body);
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      background: var(--card-sunken);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 9px 12px;
      color: var(--text);
      font-size: 13px;
      font-family: var(--font-body);
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: var(--gold-border);
      box-shadow: 0 0 0 3px var(--gold-dim);
    }

    input::placeholder { color: var(--muted); }

    .btn {
      width: 100%;
      padding: 10px 14px;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 600;
      font-family: var(--font-display);
      cursor: pointer;
      border: 1px solid transparent;
      transition: box-shadow 0.2s ease, opacity 0.15s ease, border-color 0.2s ease, background 0.15s ease;
    }

    .btn:disabled { opacity: 0.5; cursor: default; }

    /* Gold primary treatment (matches .ds-btn-primary + .btn-gold-hover) */
    .btn-primary {
      background: var(--gold-dim);
      color: var(--gold);
      border: 1px solid var(--gold-border);
    }

    .btn-primary:hover:not(:disabled) {
      box-shadow: 0 0 0 1px var(--gold-border), 0 4px 16px rgba(212, 168, 71, 0.2);
    }

    .btn-secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover:not(:disabled) { border-color: var(--gold-border); }

    .btn-danger {
      background: transparent;
      color: var(--score-red);
      border: 1px solid rgba(239, 68, 68, 0.35);
    }

    .btn-danger:hover:not(:disabled) { border-color: rgba(239, 68, 68, 0.6); }

    .status-row {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 14px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot-green { background: var(--score-green); box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.15); }
    .dot-amber { background: var(--score-amber); box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.15); }
    .dot-red { background: var(--score-red); box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15); }

    .status-text {
      font-family: var(--font-body);
      font-size: 12px;
      color: var(--muted);
    }

    /* Card surfaces (matches .ds-card token treatment) */
    .url-row {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      padding: 10px 12px;
      margin-bottom: 14px;
      overflow: hidden;
    }

    .url-label {
      font-family: var(--font-display);
      font-size: 10px;
      color: var(--muted);
      margin-bottom: 3px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 600;
    }

    .url-value {
      font-family: var(--font-body);
      font-size: 11px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .result-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      padding: 10px 12px;
      margin-top: 10px;
      font-size: 12px;
      font-family: var(--font-body);
      line-height: 1.5;
    }

    .result-success { border-color: rgba(34, 197, 94, 0.3); color: var(--score-green); }
    .result-error { border-color: rgba(239, 68, 68, 0.3); color: var(--score-red); }
    .result-info { color: var(--muted); }

    .token-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 12px;
    }

    .token-display {
      flex: 1;
      font-family: monospace;
      font-size: 11px;
      color: var(--muted);
      background: var(--card-sunken);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 8px 10px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .icon-btn {
      padding: 7px 10px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      color: var(--muted);
      font-family: var(--font-display);
      font-size: 12px;
      font-weight: 600;
      flex-shrink: 0;
      transition: color 0.15s ease, border-color 0.15s ease;
    }

    .icon-btn:hover { color: var(--gold); border-color: var(--gold-border); }

    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 16px 0;
    }

    .hint {
      font-family: var(--font-body);
      font-size: 11px;
      color: var(--muted);
      line-height: 1.6;
    }

    /* Design system removes default link underlines; emphasis via gold color */
    .hint a {
      color: var(--gold);
      text-decoration: none;
      font-weight: 600;
    }

    .hint a:hover { text-decoration: underline; }

    .mt-8 { margin-top: 8px; }
    .mt-12 { margin-top: 12px; }
    .gap-8 { display: flex; flex-direction: column; gap: 8px; }
  </style>
</head>
<body>
  <div id="app">
    <div style="padding: 24px 16px; text-align: center; color: #9ca3af; font-size: 12px;">
      Loading...
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
